[package]
name = "alouette-ai"
description = "The optional assistant: AI providers (local CLIs, Ollama, OpenAI-compatible, Anthropic, Gemini), redaction and a cost meter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
test-server = []

[dependencies]
alouette-core.workspace = true
alouette-net.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "net"] }
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
alouette-ai = { path = ".", features = ["test-server"] }

[[example]]
name = "fake_ai"
required-features = ["test-server"]
