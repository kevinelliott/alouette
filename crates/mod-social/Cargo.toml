[package]
name = "mod-social"
description = "Alouette's Social module: the fediverse (Mastodon and compatible servers)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
alouette-core.workspace = true
alouette-ui.workspace = true
alouette-net.workspace = true
