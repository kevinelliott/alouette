[package]
name = "alouette-net"
description = "Alouette's network layer: dual-stack Happy Eyeballs, TLS 1.3 with post-quantum key exchange, encrypted DNS, proxies and routing rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
alouette-core.workspace = true
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config", "https-aws-lc-rs", "tls-aws-lc-rs", "quic-aws-lc-rs", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { workspace = true, features = ["test-util"] }
