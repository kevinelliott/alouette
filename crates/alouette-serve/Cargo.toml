[package]
name = "alouette-serve"
description = "alouette serve: Alouette for several people over SSH, with per-user data, key sign-in, a guest profile and limits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
alouette-core.workspace = true
alouette-net.workspace = true
alouette-store.workspace = true
alouette-ui.workspace = true
aws-lc-rs = "1"
crossterm.workspace = true
futures.workspace = true
getrandom = "0.3"
ratatui.workspace = true
russh = "0.65"
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "time", "sync"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
vt100 = "0.18"
