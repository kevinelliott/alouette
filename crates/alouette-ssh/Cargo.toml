[package]
name = "alouette-ssh"
description = "SSH for Alouette: ssh_config import, agent, known hosts, jump hosts, forwarding and SFTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
alouette-net.workspace = true
russh = "0.65"
russh-sftp = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
alouette-core.workspace = true
alouette-ssh = { path = ".", features = ["test-server"] }

[features]
# A tiny SSH server used by tests in this and other crates.
test-server = []
