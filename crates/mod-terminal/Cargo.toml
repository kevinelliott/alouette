[package]
name = "mod-terminal"
description = "Alouette's Terminal module: local shells, SSH, Telnet and Mosh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
alouette-core.workspace = true
alouette-ui.workspace = true
