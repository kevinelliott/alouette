name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Render a screen
        run: cargo run -q -- --dump-screen 100x30 about:welcome demo:jobs
        env:
          ALOUETTE_HOME: ${{ runner.temp }}/alouette-home

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile dist
      - name: Report binary size
        run: |
          size=$(stat -c %s target/dist/alouette)
          echo "alouette is $((size / 1024)) KiB" >> "$GITHUB_STEP_SUMMARY"
          # The plan's budget for 1.0 is 40 MiB; fail early if M0 is already far off.
          test "$size" -lt $((40 * 1024 * 1024))

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: alouette:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it and check it listens
        run: |
          docker run -d --name alouette -p 2222:2222 alouette:ci
          for i in $(seq 1 20); do
            docker logs alouette 2>&1 | grep -q "Alouette is serving" && break
            sleep 1
          done
          docker logs alouette
          docker logs alouette 2>&1 | grep -q "Alouette is serving"
          docker exec alouette alouette serve users
